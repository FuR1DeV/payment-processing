[project]
name = "payment-processing"
version = "0.1.0"
description = "Asynchronous payment processing: outbox, RabbitMQ (FastStream), retries with DLQ, client webhooks."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.40,<2.2",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9",
    "faststream[rabbit,cli]>=0.7.8,<0.8",
    "httpx>=0.28,<1",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=1.0"
ruff = ">=0.12"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = [
    "S311",  # random in the gateway emulator is not used for crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
